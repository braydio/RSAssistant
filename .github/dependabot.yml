# Dependabot updates for RSAssistant.
# Separate patches from minors so only low-risk patches qualify for auto-merge.
# Missing "dependencies" label references were removed (the label does not exist).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-patches:
        update-types: [patch]
      python-minors:
        update-types: [minor]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
