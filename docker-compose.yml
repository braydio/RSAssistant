services:
  rsassistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: RSAssistant
    restart: unless-stopped
    env_file:
      - ./config/.env
    volumes:
      - ./volumes/logs:/app/volumes/logs   # Persist logs
      - ./volumes/db:/app/volumes/db       # Persist database
      - ./volumes/excel:/app/volumes/excel # Persist Excel
      - ./volumes/cache:/app/volumes/cache # Persist price cache
      - ./config:/app/config               # Mount unified config directory
    environment:
      TZ: America/New_York
      ENVIRONMENT: production
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
       test: ["CMD", "cat", "/app/volumes/logs/heartbeat.txt"]
       interval: 60s
       timeout: 10s
       retries: 3

  auto-rsa:
    container_name: auto-rsa
    image: auto-rsa-holdings:local
    build:
      context: ./auto-rsa
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./auto-rsa/.env
    tty: true
    volumes:
      - ./auto-rsa/creds:/app/creds
      - ./volumes/db:/app/volumes/db       # Shared DB with RSAssistant
      - ./auto-rsa/src:/app/src:ro
    # Scope auto-updates to this container only; RSAssistant self-updates via git
    labels:
      com.centurylinklabs.watchtower.scope: auto-rsa
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    # Auto-update the auto-rsa image every hour (opt-in via --profile upstream-image-updates)
    # https://containrrr.dev/watchtower/
    image: containrrr/watchtower
    container_name: watchtower
    hostname: auto-rsa
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - WATCHTOWER_SCOPE=auto-rsa
    profiles: ["upstream-image-updates"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
